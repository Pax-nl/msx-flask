<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ _('home_title') }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .lang-switcher {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }
        .lang-link {
            color: var(--msx-green);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border: 1px solid var(--msx-border-green);
            background: rgba(16, 32, 12, 0.8);
        }
        .lang-link.active {
            background: var(--msx-dark-green);
            font-weight: bold;
            border-color: var(--msx-bright-green);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="lang-switcher">
        <a href="{{ url_for('set_lang', lang='nl') }}" class="lang-link {% if current_lang == 'nl' %}active{% endif %}">NL</a>
        <a href="{{ url_for('set_lang', lang='en') }}" class="lang-link {% if current_lang == 'en' %}active{% endif %}">EN</a>
    </div>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
