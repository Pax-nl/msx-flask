<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ _('home_title') }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="lang-switcher">
        <a href="{{ url_for('set_lang', lang='nl') }}" class="lang-link {% if current_lang == 'nl' %}active{% endif %}">NL</a>
        <a href="{{ url_for('set_lang', lang='en') }}" class="lang-link {% if current_lang == 'en' %}active{% endif %}">EN</a>
    </div>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
