{% extends "base.html" %}

{% block content %}
<div class="header-container">
    <div class="logo">
        <span class="logo-icon">📺</span>
        <h1><span style="font-weight: 800; color: #fff;">MSX</span> <span style="font-weight: 300; font-style: italic; color: #a3c2ff;">ROM Server</span></h1>
    </div>
    <nav class="top-nav">
        <a href="/" class="active">{{ _('home_title') }}</a>
        <a href="#">Browse</a>
        <a href="#">Top Rated</a>
        <a href="{{ url_for('manage') }}">Upload</a>
        <a href="#">Account</a>
    </nav>
</div>

<div class="main-content">
    <div class="toolbar">
        <div class="view-toggles">
            <button class="icon-btn active">⊞</button>
            <button class="icon-btn">≡</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search MSX games..." />
            <button class="search-btn">🔍</button>
        </div>
    </div>

    <div class="games-container">
        <div class="games-header">
            <h3>AVAILABLE GAMES</h3>
        </div>
        <div class="games-list" id="gamesList">
            <div class="loading-spinner">{{ _('loading') }}</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const gamesList = document.getElementById('gamesList');
    const searchInput = document.getElementById('searchInput');

    let allGames = [];

    const i18n = {
        loading: "{{ _('loading') }}",
        no_files: "{{ _('no_files') }}",
        download: "{{ _('download') }}"
    };

    async function loadGames() {
        try {
            const response = await fetch('/index2.php/?type=ROM&char=a');
            if (!response.ok) throw new Error('Network error');
            const text = await response.text();
            
            const lines = text.trim().split('\n');
            if (lines.length === 0 || (lines.length === 1 && lines[0].startsWith('No files found'))) {
                gamesList.innerHTML = `<p style="padding: 2rem; color: rgba(255,255,255,0.5);">${i18n.no_files}</p>`;
                return;
            }

            allGames = lines.map((line, index) => {
                const [name, size] = line.split('\t');
                return { id: index, name: name, size: size }; 
            }).filter(g => g.name);

            renderGames(allGames);
        } catch (error) {
            gamesList.innerHTML = `<p style="color:#ff5555; padding: 2rem;">Error: ${error.message}</p>`;
        }
    }

    function renderGames(games) {
        if (games.length === 0) {
            gamesList.innerHTML = `<p style="padding: 2rem; color: rgba(255,255,255,0.5);">No matching games found.</p>`;
            return;
        }

        let html = '';
        const icons = ['🛸', '🏎️', '🧙', '🥷', '👾', '🐧', '🏰', '🚀', '🗡️', '🛡️'];

        games.forEach((game, idx) => {
            const icon = icons[idx % icons.length];
            html += `
                <div class="game-card">
                    <div class="game-icon">${icon}</div>
                    <div class="game-info">
                        <h4>${idx + 1}. ${game.name}</h4>
                        <p>Size: ${game.size} bytes &bull; Format: ROM</p>
                    </div>
                    <a href="/index2.php/?type=ROM&char=a&download=${game.id}" class="download-btn">
                        <span class="icon">☁️</span> DOWNLOAD (ROM)
                    </a>
                </div>
            `;
        });
        gamesList.innerHTML = html;
    }

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allGames.filter(g => g.name.toLowerCase().includes(query));
        renderGames(filtered);
    });

    loadGames();
</script>
{% endblock %}
