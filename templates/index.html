{% extends "base.html" %}

{% block content %}
<div class="mb-8 p-6 bg-black/40 border border-emerald-900/40 rounded-sm">
    <div class="flex justify-between items-center mb-6 border-b border-emerald-900/30 pb-4">
        <h2 class="text-xl text-emerald-300 font-bold uppercase tracking-widest">> AVAILABLE GAMES</h2>
        
        <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-emerald-700">>&nbsp;</span>
            <input type="text" id="searchInput" placeholder="Search.exe..." 
                   class="bg-black/60 border border-emerald-800 text-emerald-300 rounded-sm py-1.5 pl-8 pr-4 w-64 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder-emerald-800" />
        </div>
    </div>

    <div id="gamesList" class="space-y-3">
        <div class="text-center py-10 text-emerald-600 animate-pulse">
            LOADING.COM...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const gamesList = document.getElementById('gamesList');
    const searchInput = document.getElementById('searchInput');
    let allGames = [];

    const i18n = {
        no_files: "{{ _('no_files') }}",
        download: "{{ _('download') }}"
    };

    async function loadGames() {
        try {
            const response = await fetch('/index2.php/?type=ROM&char=a');
            if (!response.ok) throw new Error('Network error');
            const text = await response.text();
            
            const lines = text.trim().split('\n');
            if (lines.length === 0 || (lines.length === 1 && lines[0].startsWith('No files found'))) {
                gamesList.innerHTML = `<div class="text-emerald-700 py-8 text-center border border-emerald-900/30 bg-black/20">[ ERROR: ${i18n.no_files} ]</div>`;
                return;
            }

            allGames = lines.map((line, index) => {
                const [name, size] = line.split('\t');
                return { id: index, name: name, size: size }; 
            }).filter(g => g.name);

            renderGames(allGames);
        } catch (error) {
            gamesList.innerHTML = `<div class="text-red-500 py-8 text-center border border-red-900/30 bg-red-950/20">[ FATAL ERROR: ${error.message} ]</div>`;
        }
    }

    function renderGames(games) {
        if (games.length === 0) {
            gamesList.innerHTML = `<div class="text-emerald-700 py-8 text-center border border-emerald-900/30 bg-black/20">[ ERROR: NO MATCHING DATA ]</div>`;
            return;
        }

        let html = '';
        const icons = ['[+]', '[*]', '[#]', '[~]'];

        games.forEach((game, idx) => {
            const icon = icons[idx % icons.length];
            html += `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-emerald-950/10 border border-emerald-900/20 hover:bg-emerald-900/20 hover:border-emerald-700/50 transition-all rounded-sm group">
                    <div class="flex items-center mb-4 sm:mb-0">
                        <div class="text-emerald-700 font-bold mr-4 font-mono group-hover:text-emerald-400 transition-colors">${icon}</div>
                        <div>
                            <h4 class="text-emerald-100 font-bold text-lg">${(idx + 1).toString().padStart(2, '0')}. ${game.name}</h4>
                            <p class="text-emerald-600/80 text-xs mt-1">SIZE: ${game.size} BYTES | FMT: ROM</p>
                        </div>
                    </div>
                    <a href="/index2.php/?type=ROM&char=a&download=${game.id}" 
                       class="inline-flex items-center justify-center px-4 py-2 bg-emerald-900/40 border border-emerald-700 text-emerald-300 hover:bg-emerald-700 hover:text-emerald-50 transition-colors rounded-sm text-sm font-bold uppercase tracking-wider">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        DOWNLOAD
                    </a>
                </div>
            `;
        });
        gamesList.innerHTML = html;
    }

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allGames.filter(g => g.name.toLowerCase().includes(query));
        renderGames(filtered);
    });

    loadGames();
</script>
{% endblock %}
